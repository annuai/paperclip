name: Release

# Push a tag like v0.2.0 to build installers for macOS (universal), Windows and Linux.
# Each platform uploads into a draft release; once ALL of them succeed, the `publish` job makes it public. If any
# platform fails, the release stays a draft (nothing is offered to the auto-updater): fix it, re-run the failed
# job, and `publish` runs when everything is green.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
          - platform: windows-latest
            args: --config src-tauri/tauri.release.conf.json
          - platform: ubuntu-22.04
            args: --config src-tauri/tauri.release.conf.json
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both Apple targets are needed for the universal binary; harmless on the other runners.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # macOS signing and notarization. Each variable is exported only when its secret exists: Tauri reads the
      # mere presence of APPLE_CERTIFICATE as "sign this", so an empty value must never reach it.
      - name: Enable Apple signing when secrets are set
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret: building unsigned."
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          # Notarization needs all three of these; skip them if any is missing.
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v=${!v}" >> "$GITHUB_ENV"
            done
          else
            echo "Apple ID secrets incomplete: signing without notarization."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing. The release config (src-tauri/tauri.release.conf.json, passed in `args`) turns on
          # createUpdaterArtifacts, which fails without this key; local builds leave it off. The key has no password; the secret may stay empty.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Paperclip ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download Paperclip for your platform.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: release # runs only when every platform above succeeded
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
